<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <title>Trackker | Live</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4" integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N" crossorigin="anonymous"></script>

    <script>
        let pendingColorUpdate = false;

        /**
         * Extrait les couleurs dominantes d'une image
         * Retourne à la fois les couleurs pour le gradient et une couleur d'accent
         */
        function extractDominantColors(imgElement) {
            if (!imgElement || !imgElement.complete || imgElement.naturalWidth === 0) {
                return null;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 80;
            canvas.height = 80;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            try {
                ctx.drawImage(imgElement, 0, 0, 80, 80);
                const imageData = ctx.getImageData(0, 0, 80, 80);
                const data = imageData.data;

                const colors = [];
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] > 125) {
                        colors.push({ r: data[i], g: data[i + 1], b: data[i + 2] });
                    }
                }

                colors.sort((a, b) => {
                    const lumaA = a.r * 0.299 + a.g * 0.587 + a.b * 0.114;
                    const lumaB = b.r * 0.299 + b.g * 0.587 + b.b * 0.114;
                    return lumaB - lumaA;
                });

                const gradientColors = [colors[Math.floor(colors.length * 0.2)], colors[Math.floor(colors.length * 0.5)], colors[Math.floor(colors.length * 0.8)]].filter(c => c);
                const accentColor = findComplementaryHue(gradientColors, colors);

                return { gradient: gradientColors, accent: accentColor };
            } catch (e) {
                return null;
            }
        }

        /**
         * Convertit une couleur RGB en sa valeur de teinte (hue)
         * Retourne une valeur entre 0 et 1
         */
        function rgbToHue(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h = 0;

            if (max !== min) {
                const d = max - min;
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return h;
        }

        /**
         * Calcule la luminance relative d'une couleur selon WCAG
         */
        function getLuminance(r, g, b) {
            const [rs, gs, bs] = [r, g, b].map(val => {
                val = val / 255;
                return val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }

        /**
         * Calcule le ratio de contraste WCAG entre deux couleurs
         */
        function getContrastRatio(r1, g1, b1, r2, g2, b2) {
            const lum1 = getLuminance(r1, g1, b1);
            const lum2 = getLuminance(r2, g2, b2);
            const lighter = Math.max(lum1, lum2);
            const darker = Math.min(lum1, lum2);
            return (lighter + 0.05) / (darker + 0.05);
        }

        /**
         * Calcule la luminance moyenne du gradient
         */
        function getGradientLuminance(gradientColors) {
            const luminances = gradientColors.map(c => getLuminance(c.r, c.g, c.b));
            return luminances.reduce((a, b) => a + b, 0) / luminances.length;
        }

        /**
         * Trouve une couleur d'accent avec un bon contraste WCAG
         * Essaie d'abord les couleurs détectées, puis fallback à noir/blanc
         */
        function findComplementaryHue(gradientColors, allColors) {
            const bgLuminance = getGradientLuminance(gradientColors);

            // Étape 1: Chercher une couleur avec bon contraste parmi toutes les couleurs détectées
            let bestColor = null;
            let bestContrast = 0;

            for (const color of allColors) {
                // Calculer le contraste avec chaque couleur du gradient et garder le minimum
                let minContrast = Infinity;
                for (const gradColor of gradientColors) {
                    const contrast = getContrastRatio(color.r, color.g, color.b,
                        gradColor.r, gradColor.g, gradColor.b);
                    minContrast = Math.min(minContrast, contrast);
                }

                // Garder la couleur avec le meilleur contraste minimum
                if (minContrast > bestContrast) {
                    bestContrast = minContrast;
                    bestColor = color;
                }
            }

            // Si on trouve une couleur avec contraste acceptable (3.0:1), l'utiliser
            if (bestColor && bestContrast >= 3.0) {
                return bestColor;
            }

            // Étape 2: Chercher spécifiquement une couleur avec contraste très bon (4.5:1+)
            for (const color of allColors) {
                let minContrast = Infinity;
                for (const gradColor of gradientColors) {
                    const contrast = getContrastRatio(color.r, color.g, color.b,
                        gradColor.r, gradColor.g, gradColor.b);
                    minContrast = Math.min(minContrast, contrast);
                }

                if (minContrast >= 4.5) {
                    return color;
                }
            }

            // Étape 3: Fallback à noir ou blanc si aucune couleur détectée n'a bon contraste
            return bgLuminance > 0.5 ? { r: 0, g: 0, b: 0 } : { r: 255, g: 255, b: 255 };
        }

        /**
         * Applique le thème (gradient + couleurs du texte) à partir de la cover
         * Gère la transition fluide des couleurs
         */
        function applyThemeFromCover(imgElement) {
            if (pendingColorUpdate) return;
            pendingColorUpdate = true;

            requestAnimationFrame(() => {
                const colorData = extractDominantColors(imgElement);
                if (!colorData || !colorData.gradient || colorData.gradient.length === 0) {
                    pendingColorUpdate = false;
                    return;
                }

                // Créer le gradient pour le background
                const colors = colorData.gradient;
                const newGradient = `linear-gradient(135deg, rgb(${colors[0].r}, ${colors[0].g}, ${colors[0].b}) 0%, rgb(${colors[1].r}, ${colors[1].g}, ${colors[1].b}) 50%, rgb(${colors[2].r}, ${colors[2].g}, ${colors[2].b}) 100%)`;

                // Initialiser le div de transition s'il n'existe pas
                let transitionDiv = document.getElementById('transition-layer');
                if (!transitionDiv) {
                    transitionDiv = document.createElement('div');
                    transitionDiv.id = 'transition-layer';
                    transitionDiv.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        z-index: -1;
                        opacity: 0;
                        transition: opacity 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                        pointer-events: none;
                    `;
                    document.body.appendChild(transitionDiv);
                }

                // Appliquer le nouveau gradient et l'opacifier pour une transition fluide
                transitionDiv.style.background = newGradient;
                setTimeout(() => {
                    transitionDiv.style.opacity = '1';
                }, 10);

                // Finaliser la transition
                setTimeout(() => {
                    document.body.style.background = newGradient;
                    transitionDiv.style.opacity = '0';
                }, 2600);

                // Appliquer la couleur d'accent au texte
                const accentColor = colorData.accent;
                const textColorRgb = `rgb(${accentColor.r}, ${accentColor.g}, ${accentColor.b})`;

                const title = document.querySelector('.track-title');
                const artist = document.querySelector('.artist-name');

                if (title) title.style.color = textColorRgb;
                if (artist) artist.style.color = textColorRgb;

                pendingColorUpdate = false;
            });
        }

        // Ajouter animation de fade-out avant le swap
        document.addEventListener('htmx:beforeSwap', (event) => {
            const container = document.querySelector('.track-container');
            if (container && event.detail.xhr.responseURL.includes('/events')) {
                container.classList.add('fade-out');
            }
        });

        // Appliquer le thème après le swap
        document.addEventListener('htmx:afterSwap', (event) => {
            const container = document.querySelector('.track-container');
            if (container) {
                container.classList.remove('fade-out');
            }

            const img = document.querySelector('.cover');
            if (img && img.complete && img.naturalWidth > 0) {
                applyThemeFromCover(img);
            } else if (img) {
                img.onload = function() {
                    applyThemeFromCover(this);
                };
            }
        });

        // Nettoyer les images cassées
        document.addEventListener('error', e => {
            if (e.target.tagName === 'IMG' && e.target.classList.contains('cover')) {
                e.target.remove();
            }
        }, true);
    </script>
</head>
<body>
<div id="app">
    <div hx-ext="sse" sse-connect="/events" sse-swap="track" class="track-container">
        <img src="/cover/-1" alt="cover" class="cover"/>
        <div class="track-info">
            <span class="artist-name">Artists</span>
            <span class="track-title">Evyntia</span>
        </div>
    </div>
</div>
</body>
</html>
